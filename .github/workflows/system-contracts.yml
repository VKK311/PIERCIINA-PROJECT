name: System contract gates

on:
  push:
    branches: [claude/pink-mall-development]
    paths:
      - docs/pink-mall/system-contracts/**
      - docs/pink-mall/workstation/**
      - docs/pink-mall/avatar-skill/v1.3/**
      - tools/regression/**
      - .github/workflows/system-contracts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema-audit dependency
        run: python -m pip install -r tools/regression/requirements-contracts.txt
      - name: Validate contracts, schemas and adversarial controls
        run: python tools/regression/system_contracts_suite.py
