name: Pink Mall standalone review build

# Repository regression passing is not the same as the file a human downloads
# working. PINKMALL.html plus assets/ is correct for production, but on its own
# it has dangling relative paths and no product photography.
#
# So every change to the canonical HTML regenerates a portable review artifact
# with its local images inlined as data: URIs.
#
# Loop safety: the output PINKMALL_REVIEW_STANDALONE.html is deliberately not in
# the trigger paths, so this cannot retrigger itself.

on:
  push:
    branches:
      - claude/pink-mall-development
      - codex/pm-038-039-validation
    paths:
      - 'PINKMALL.html'
      - 'assets/**'
      - 'tools/build_standalone_review.py'
      - '.github/workflows/standalone-review.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: standalone-review
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build standalone review artifact
        run: python tools/build_standalone_review.py

      - name: Prove it works with no assets/ tree
        run: bash tools/verify_standalone.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install publication browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pinkmall-regression" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/pinkmall-regression/node_modules/.bin/playwright" install --with-deps chromium

      - name: Validate PM-038 and PM-039 in production and standalone
        env:
          NODE_PATH: ${{ runner.temp }}/pinkmall-regression/node_modules
        run: |
          python -m http.server 8131 >"$RUNNER_TEMP/pinkmall-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tools/regression/product_regression.js tools/regression/expect/PM-038.json PINKMALL.html 8131
          node tools/regression/product_regression.js tools/regression/expect/PM-038.json PINKMALL_REVIEW_STANDALONE.html 8131
          node tools/regression/product_regression.js tools/regression/expect/PM-039.json PINKMALL.html 8131
          node tools/regression/product_regression.js tools/regression/expect/PM-039.json PINKMALL_REVIEW_STANDALONE.html 8131

      - name: Commit artifact
        if: github.ref_name == 'claude/pink-mall-development'
        run: bash tools/commit_standalone.sh
