name: Pink Mall media acquisition

# Why this exists: the Claude execution container cannot reach brand CDNs —
# its egress proxy answers 403 to CONNECT for assets.adidas.com and friends —
# but it can always reach GitHub. A GitHub-hosted runner has ordinary internet
# access, so the runner performs the byte acquisition and commits the result
# back. Claude then simply pulls.
#
# Loop safety: results are written under docs/pink-mall/media-acquisition/,
# which is deliberately NOT in the trigger paths, so the workflow cannot
# retrigger itself. The bot-actor guard is a second line of defence.

on:
  push:
    branches: [claude/pink-mall-development]
    paths:
      - 'docs/pink-mall/media-requests/**'
      - 'tools/media_acquisition/**'
      - '.github/workflows/media-acquisition.yml'
  workflow_dispatch:
    inputs:
      sku:
        description: 'SKU to (re)acquire; blank = use run_all'
        required: false
        default: ''
      run_all:
        description: 'Regression mode: reprocess every request manifest'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: media-acquisition
  cancel-in-progress: false

jobs:
  acquire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/pink-mall-development
          # Two commits so a push can be diffed against its predecessor to
          # find which request manifests actually changed.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet -r tools/media_acquisition/requirements.txt

      # Chromium for the bounded SPA render fallback. Only Chromium, and only
      # its own dependencies: this is not a general browser automation setup.
      # A page is rendered solely when it is an already evidenced exact-SKU
      # shell — see tools/media_acquisition/render.py.
      - name: Install Chromium for SPA rendering
        run: python -m playwright install --with-deps chromium

      # Which SKUs this run is actually for. github.event.inputs.sku is empty
      # on push, so the old wiring silently meant "every manifest" — which made
      # onboarding one product cost a full re-run of the historical catalogue,
      # and with indexed evidence enabled that approached the timeout. Scope is
      # the fix; a larger timeout would only have hidden it.
      - name: Select SKUs
        id: select
        env:
          DISPATCH_SKU: ${{ github.event.inputs.sku }}
          RUN_ALL: ${{ github.event.inputs.run_all }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_SKU:-}" ]; then
            echo "skus=${DISPATCH_SKU}" >> "$GITHUB_OUTPUT"
            echo "mode=dispatch-single" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${RUN_ALL:-false}" = "true" ]; then
            echo "skus=" >> "$GITHUB_OUTPUT"
            echo "mode=regression-all" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=""
          if [ -n "${BEFORE:-}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            changed="$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}" -- \
                        'docs/pink-mall/media-requests/*.request.json' || true)"
          fi
          if [ -z "$changed" ]; then
            changed="$(git diff --name-only HEAD~1 HEAD -- \
                        'docs/pink-mall/media-requests/*.request.json' || true)"
          fi
          skus="$(printf '%s\n' $changed | sed -n 's#.*/\([^/]*\)\.request\.json#\1#p' \
                  | sort -u | paste -sd, -)"
          echo "skus=${skus}" >> "$GITHUB_OUTPUT"
          if [ -z "$skus" ]; then
            echo "mode=none" >> "$GITHUB_OUTPUT"
          else
            echo "mode=changed-manifests" >> "$GITHUB_OUTPUT"
          fi

      - name: Acquire media
        id: acquire
        env:
          ONLY_SKUS: ${{ steps.select.outputs.skus }}
          SELECT_MODE: ${{ steps.select.outputs.mode }}
        run: bash tools/media_acquisition/run_requests.sh

      - name: Job summary
        if: always()
        run: python tools/media_acquisition/summarise.py >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        if: always()
        run: bash tools/media_acquisition/commit_results.sh

      - name: Fail if acquisition did not PASS
        if: steps.acquire.outputs.rc != '0'
        run: |
          echo "One or more SKUs did not reach PASS. Results and logs are committed; read result.json." >&2
          exit 1
