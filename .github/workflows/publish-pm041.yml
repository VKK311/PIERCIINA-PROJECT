name: Publish PM-041 Police SPLA94

on:
  push:
    branches: [claude/pink-mall-development]
    paths:
      - '.github/workflows/publish-pm041.yml'
      - 'tools/publish_pm041.py'
      - 'tools/regression/pm041_mobile_smoke.js'
      - 'tools/patch_pm041_harness.py'

permissions:
  contents: write

concurrency:
  group: publish-pm041
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 4

      - name: Verify staged publication ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a0b696e4c19ce2eee26f6237928ecab06648ad81 HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependency
        run: python -m pip install --quiet Pillow

      - name: Prepare PM-041
        run: |
          python tools/publish_pm041.py prepare
          python tools/patch_pm041_harness.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install publication browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pinkmall-regression" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/pinkmall-regression/node_modules/.bin/playwright" install --with-deps chromium

      - name: Validate production PM-041
        env:
          NODE_PATH: ${{ runner.temp }}/pinkmall-regression/node_modules
        run: |
          set -euo pipefail
          python -m http.server 8131 >"$RUNNER_TEMP/pinkmall-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tools/regression/product_regression.js tools/regression/expect/PM-041.json PINKMALL.html 8131
          node tools/regression/pm041_mobile_smoke.js PINKMALL.html 8131

      - name: Build portable standalone
        run: |
          python tools/build_standalone_review.py
          bash tools/verify_standalone.sh

      - name: Validate standalone PM-041
        env:
          NODE_PATH: ${{ runner.temp }}/pinkmall-regression/node_modules
        run: |
          set -euo pipefail
          python -m http.server 8132 >"$RUNNER_TEMP/pinkmall-http-standalone.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tools/regression/product_regression.js tools/regression/expect/PM-041.json PINKMALL_REVIEW_STANDALONE.html 8132

      - name: Finalize project state
        run: python tools/publish_pm041.py finalize

      - name: Remove one-shot publication tooling
        run: |
          rm -f .github/workflows/publish-pm041.yml tools/publish_pm041.py tools/regression/pm041_mobile_smoke.js tools/patch_pm041_harness.py

      - name: Refuse concurrent branch movement
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/claude/pink-mall-development | awk '{print $1}')"
          test "$remote_sha" = "${GITHUB_SHA}"

      - name: Commit validated publication
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish PM-041 Police Moonbeam 1 SPLA94 [skip ci]"
          git push origin HEAD:claude/pink-mall-development
