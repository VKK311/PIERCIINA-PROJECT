name: Publish PM-042 to PM-044 batch

on:
  push:
    branches: [claude/pink-mall-development]
    paths:
      - '.github/workflows/publish-pm042-044.yml'
      - 'tools/publish_pm042_044.py'
      - 'docs/pink-mall/publication-staging/pm042-044-owner-media.zip'

permissions:
  contents: write

concurrency:
  group: publish-pm042-044
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 10

      - name: Verify staged publication ancestry
        run: |
          set -euo pipefail
          git merge-base --is-ancestor df262ba50f8b0d0392a253bb7ab8dffc01545cc0 HEAD
          test "$(git show HEAD:PINKMALL.html | sha256sum | awk '{print $1}')" = "c233bc784c2a7c2bc236c00d3879e032c1fdb16fed36afdb7ab71c59a85fd5c7"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publication dependencies
        run: python -m pip install --quiet Pillow playwright

      - name: Stage approved owner media
        run: |
          set -euo pipefail
          rm -rf .owner-media
          mkdir -p .owner-media
          unzip -q docs/pink-mall/publication-staging/pm042-044-owner-media.zip -d .owner-media
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib
          root=Path('.owner-media')
          for pid in ('PM-042','PM-043','PM-044'):
              files=sorted((root/pid).glob('owner-*.webp'))
              if len(files) != 3:
                  raise SystemExit(f'{pid}: expected 3 owner files, got {len(files)}')
              shas=[]
              for f in files:
                  with Image.open(f) as im:
                      if im.size != (970,1182):
                          raise SystemExit(f'{f}: unexpected dimensions {im.size}')
                  shas.append(hashlib.sha256(f.read_bytes()).hexdigest())
              if len(set(shas)) != 3:
                  raise SystemExit(f'{pid}: duplicate owner media bytes')
              print(pid, 'OWNER MEDIA PASS', *shas)
          PY

      - name: Wire owner media into publication builder
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/publish_pm042_044.py')
          s=p.read_text(encoding='utf-8')
          needle="def capture_product(product):\n    pid=product['id']; live_dir=ROOT/'assets/pink-mall/products'/pid"
          repl="""def capture_product(product):
    pid=product['id']
    owner_dir=ROOT/'.owner-media'/pid
    if owner_dir.exists():
        live_dir=ROOT/'assets/pink-mall/products'/pid
        src_dir=live_dir/'source'
        src_dir.mkdir(parents=True,exist_ok=True)
        finals=[]
        source_shas=[]
        for idx in range(1,4):
            src=owner_dir/f'owner-{idx:02d}.webp'
            if not src.exists():
                raise SystemExit(f'{pid}: missing approved owner frame {idx}')
            source_sha=hashlib.sha256(src.read_bytes()).hexdigest()
            source_shas.append(source_sha)
            preserved=src_dir/f'{pid}-owner-{idx:02d}.webp'
            shutil.copy2(src,preserved)
            final=live_dir/(f'{pid}-main.webp' if idx==1 else f'{pid}-{idx:02d}.webp')
            shutil.copy2(src,final)
            with Image.open(final) as im:
                if im.size != (970,1182):
                    raise SystemExit(f'{pid}: owner frame dimensions changed: {im.size}')
            finals.append(final)
        if len(set(source_shas)) != 3:
            raise SystemExit(f'{pid}: owner frames are not byte-unique')
        readme=['# '+pid+' — live product media','',f\"- User-approved product: {product['brand']} {product['manufacturerItemNo']}\",f'- Published: {PUB_DATE}','- Media transport: `USER_SUPPLIED`.','- Three byte-unique owner-approved exact-product images.','- Technical WebP preservation only; no crop, resize, upscale, recolouring or generative edit.','']
        for i,f in enumerate(finals,1):
            readme.append(f'- IMAGE {i}: `{f.name}` — 970×1182 — SHA-256 `{sha256(f)}`')
        (live_dir/'README.md').write_text('\\n'.join(readme)+'\\n',encoding='utf-8')
        return finals
    live_dir=ROOT/'assets/pink-mall/products'/pid"""
          if needle not in s:
              raise SystemExit('capture_product patch anchor missing')
          s=s.replace(needle,repl,1)
          s=s.replace("'mediaTransport':'TRUSTED_RETAILER'","'mediaTransport':'USER_SUPPLIED'")
          s=s.replace("'mediaTransport':'OFFICIAL'","'mediaTransport':'USER_SUPPLIED'")
          p.write_text(s,encoding='utf-8')
          PY

      - name: Prepare PM-042 to PM-044
        run: python tools/publish_pm042_044.py prepare

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install publication browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pinkmall-regression" --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/pinkmall-regression/node_modules/.bin/playwright" install --with-deps chromium

      - name: Validate production batch
        env:
          NODE_PATH: ${{ runner.temp }}/pinkmall-regression/node_modules
        run: |
          set -euo pipefail
          python -m http.server 8131 >"$RUNNER_TEMP/pinkmall-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for id in PM-042 PM-043 PM-044; do
            node tools/regression/product_regression.js "tools/regression/expect/${id}.json" PINKMALL.html 8131
          done
          node tools/regression/pm042_044_mobile_smoke.js PINKMALL.html 8131

      - name: Build portable standalone
        run: |
          python tools/build_standalone_review.py
          bash tools/verify_standalone.sh

      - name: Validate standalone batch
        env:
          NODE_PATH: ${{ runner.temp }}/pinkmall-regression/node_modules
        run: |
          set -euo pipefail
          python -m http.server 8132 >"$RUNNER_TEMP/pinkmall-http-standalone.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for id in PM-042 PM-043 PM-044; do
            node tools/regression/product_regression.js "tools/regression/expect/${id}.json" PINKMALL_REVIEW_STANDALONE.html 8132
          done

      - name: Finalize project state
        run: python tools/publish_pm042_044.py finalize

      - name: Remove one-shot publication tooling and staging
        run: |
          rm -rf .owner-media
          rm -f .github/workflows/publish-pm042-044.yml tools/publish_pm042_044.py tools/regression/pm042_044_mobile_smoke.js
          rm -f docs/pink-mall/publication-staging/pm042-044-owner-media.zip
          rm -f docs/pink-mall/media-acquisition/6LPESC-J4836/user-supplied/6LPESC-J4836-owner-02.webp
          rmdir docs/pink-mall/media-acquisition/6LPESC-J4836/user-supplied 2>/dev/null || true
          rmdir docs/pink-mall/publication-staging 2>/dev/null || true

      - name: Refuse concurrent branch movement
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin refs/heads/claude/pink-mall-development | awk '{print $1}')"
          test "$remote_sha" = "${GITHUB_SHA}"

      - name: Commit validated publication
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish PM-042 Lanvin, PM-043 Swarovski, PM-044 Calvin Klein [skip ci]"
          git push origin HEAD:claude/pink-mall-development
