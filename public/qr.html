<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pierciina Card QR</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/logo.svg">
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    main { text-align: center; }
    .qr { background: #fff; padding: 20px; border-radius: 16px; display: inline-block; margin: 20px 0; }
    .qr img { width: 260px; height: 260px; display: block; }
  </style>
</head>
<body>
<main>
  <div class="brand" style="justify-content:center"><img src="/assets/logo.svg" alt=""><span>PIERCIINA</span></div>
  <h1>Pierciina Loyalty Card</h1>
  <p class="sub">Сканирай и вземи картата си · Scan to get your card</p>
  <div class="qr"><img src="/api/img/register-qr.svg" alt="QR код за регистрация"></div>
  <p class="sub">5 ★ = 50% OFF your 6th piercing</p>
  <p class="no-print muted">Отпечатайте тази страница за стикер на рецепцията или я направете на скрийншот за Instagram.</p>
  <button class="no-print" onclick="print()" style="max-width:240px">Печат</button>
</main>
</body>
</html>
